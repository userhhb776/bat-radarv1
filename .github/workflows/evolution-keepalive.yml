name: Evolution keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: evolution-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake WhatsApp server without sending messages
        env:
          EVOLUTION_URL: ${{ vars.EVOLUTION_KEEPALIVE_URL || 'https://papalead-evolution.onrender.com' }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 15 --max-time 60 \
            --retry 1 --retry-delay 5 --retry-max-time 130 \
            "${EVOLUTION_URL%/}/"